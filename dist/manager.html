<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4bdb">
<title>LeaveDesk – Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f4f2fb; --card:#fff; --ink:#1e1b33; --mute:#716d8c; --line:#e7e3f4;
  --brand:#5b4bdb; --brand-d:#4333b8; --brand-l:#ece9fd; --grad:linear-gradient(135deg,#5b4bdb 0%,#8a4fe0 55%,#d0408f 100%);
  --amber:#b86e00; --amber-l:#fff0d1; --green:#13875a; --green-l:#dcf5e8;
  --red:#d6405a; --red-l:#fde6ea; --blue:#0e8fa3; --blue-l:#dff3f6; --plum:#c0398f; --plum-l:#fae4f2;
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12101f;--card:#1c1930;--ink:#f0eefc;--mute:#a09cc0;--line:#2d2947;--brand:#8b7dff;--brand-d:#b4a9ff;--brand-l:#2a2550;
  --amber-l:#3b2e12;--green-l:#143a2a;--red-l:#3d1b25;--blue-l:#12333a;--plum-l:#3a1b33;--amber:#f0b04a;--green:#52d49a;--red:#ff7b91;--blue:#4fc8dc;--plum:#ee7cc4}
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;min-width:0}
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,textarea{max-width:100%}
.m b,.hol .m b{overflow-wrap:anywhere}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.phone{width:100%;height:100vh;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;overflow-y:auto;padding:0 16px 110px;scroll-behavior:smooth}
#view>.page{max-width:1080px;margin:0 auto}
.narrow{max-width:620px;margin:0 auto}
.cols{display:block}
.list2{display:block}
.brand,.sidelink{display:none}
.toast{max-width:420px;margin:0 auto}
#view::-webkit-scrollbar{display:none}
h1,h2,.serif{font-family:Fraunces,serif;font-weight:600}
header.top{display:flex;align-items:center;gap:12px;padding:20px 0 14px}
header.top .t{flex:1}
header.top .t small{color:var(--mute);font-size:13px;display:block}
header.top .t h1{font-size:24px;line-height:1.15}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;border:none;cursor:pointer;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px}
.sec h2{font-size:18px}.sec a{font-size:13px;color:var(--brand);font-weight:600;cursor:pointer}
.hero{background:var(--grad);color:#fff;border:none;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{opacity:.8;font-size:13px}
.hero .big{font-family:Fraunces,serif;font-size:40px;line-height:1.1;margin:4px 0 12px}
.hero .row{display:flex;gap:8px}
.hero .chip{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;font-size:13px;flex:1}
.hero .chip b{display:block;font-size:17px}
.balances{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bal{text-align:center;padding:14px 6px}
.ring{width:62px;height:62px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:16px}
.bal small{color:var(--mute);font-size:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.qa b{font-size:15px}.qa small{color:var(--mute);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.Pending{background:var(--amber-l);color:var(--amber)}
.pill.Approved{background:var(--green-l);color:var(--green)}
.pill.Rejected{background:var(--red-l);color:var(--red)}
.pill.Cancelled{background:var(--line);color:var(--mute)}
.req{display:flex;gap:12px;align-items:center;cursor:pointer;padding:14px}
.req .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.req .m{flex:1;min-width:0}.req .m b{display:block;font-size:15px}.req .m small{color:var(--mute);font-size:13px}
.hol{display:flex;gap:12px;align-items:center;padding:12px 14px}
.hol .d{width:46px;text-align:center;border-radius:12px;background:var(--brand-l);color:var(--brand-d);padding:6px 0;flex:none}
.hol .d b{display:block;font-size:18px;line-height:1}.hol .d small{font-size:11px;text-transform:uppercase;font-weight:600}
.hol .m b{display:block;font-size:14px}.hol .m small{color:var(--mute);font-size:12px}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
#view{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.qa,.type,.fl,.menu,.req{min-height:44px}
nav button{flex:1;border:none;background:none;color:var(--mute);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0}
nav button.on{color:var(--brand)}
nav button.apply .fab{width:50px;height:50px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(91,75,219,.45);border:4px solid var(--bg)}
nav button.apply{color:var(--brand)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* forms */
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:none;background:none;padding:10px;border-radius:11px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.in{width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.in:focus{outline:none;border-color:var(--brand)}
textarea.in{resize:none;height:90px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.type b{display:block;font-size:13px}.type small{color:var(--mute);font-size:11px}
.type.on{border-color:var(--brand);background:var(--brand-l)}
.toggle{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--card)}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--grad)}.sw.on:after{left:23px}
.mgr{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:13px;background:var(--brand-l);margin-top:14px;font-size:13px}
.mgr .avatar{width:34px;height:34px;font-size:12px}
.sum{margin-top:14px;padding:14px;border-radius:13px;border:1.5px dashed var(--line);font-size:14px}
.sum b{font-size:18px}
.err{background:var(--red-l);color:var(--red);padding:11px 14px;border-radius:12px;font-size:13px;font-weight:500;margin-top:14px}
.btn{width:100%;padding:15px;border-radius:15px;border:none;background:var(--grad);box-shadow:0 8px 18px rgba(91,75,219,.3);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:18px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:none;box-shadow:none;color:var(--red);border:1.5px solid var(--line)}
/* chips filter */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.filters::-webkit-scrollbar{display:none}
.fl{border:1.5px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;font:inherit;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.fl.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead b{font-family:Fraunces,serif;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .dow{font-size:11px;color:var(--mute);font-weight:600;padding:4px 0}
.cell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:14px;position:relative;cursor:pointer;border:none;background:none;color:var(--ink);font-family:inherit}
.cell.we{color:var(--mute)}
.cell.today{outline:2px solid var(--brand);outline-offset:-2px;font-weight:700}
.cell.hol{background:var(--brand-l);color:var(--brand-d);font-weight:700}
.cell.sel{background:var(--brand);color:#fff}
.cell i{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:12px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-family:Fraunces,serif}.stat small{font-size:11px;color:var(--mute)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--bg);width:100%;border-radius:26px 26px 0 0;padding:10px 18px 28px;max-height:88%;overflow-y:auto;animation:up .25s}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:9px;margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.tl{position:relative;padding-left:26px;margin-top:6px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;margin-bottom:16px;font-size:14px}
.tl div:before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--line));border:2px solid var(--bg)}
.tl small{display:block;color:var(--mute);font-size:12px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:none}.kv span:first-child{color:var(--mute)}
.toast{position:fixed;top:18px;left:16px;right:16px;background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:20;animation:fade .2s}
.empty{text-align:center;color:var(--mute);padding:40px 10px;font-size:14px}
.prof{text-align:center;padding:10px 0 4px}
.prof .avatar{width:84px;height:84px;font-size:28px;margin:0 auto 10px}
.prof h1{font-size:24px}.prof p{color:var(--mute);font-size:14px}
.menu{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer}
.menu:last-child{border:none}.menu span{flex:1}

/* tablet / desktop */
@media(min-width:700px){
  #view{padding:0 32px 60px}
  .list2{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
  .sheet{max-width:520px;margin:0 auto}
}
@media(min-width:900px){
  .phone{flex-direction:row}
  #view{padding:0 44px 60px}
  header.top{padding-top:32px}
  header.top .t h1{font-size:30px}
  nav{position:static;flex-direction:column;justify-content:flex-start;width:230px;flex:none;border-top:none;border-right:1px solid var(--line);padding:26px 14px;gap:4px;order:-1}
  nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:13px;justify-content:flex-start}
  nav button:hover{background:var(--brand-l)}
  nav button.on{background:var(--brand-l)}
  nav button.apply{order:-1;background:var(--grad);color:#fff;margin-bottom:14px;justify-content:center}
  nav button.apply:hover{filter:brightness(.95)}
  nav button.apply .fab{width:auto;height:auto;margin:0;background:none;box-shadow:none;border:none}
  .brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:20px;padding:0 14px 22px;order:-2}
  .brand i{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
  .sidelink{display:flex;margin-top:auto}
  .cols{display:grid;grid-template-columns:3fr 2fr;gap:28px;align-items:start}
  .hero .big{font-size:48px}
  .scrim{align-items:center}.sheet{border-radius:26px;padding-top:22px}.sheet .grab{display:none}
  .toast{left:auto;right:24px;top:24px;width:360px}
}

/* very small phones */
@media(max-width:379px){
  #view{padding-left:12px;padding-right:12px}
  header.top .t h1{font-size:21px}
  .hero .big{font-size:34px}.hero .row{flex-direction:column}
  .balances{gap:6px}.bal{padding:12px 4px}.ring{width:54px;height:54px}.ring span{width:42px;height:42px;font-size:14px}
  .types{gap:6px}.type{padding:10px 4px}
  .two{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cell{font-size:12px;border-radius:8px}.grid{gap:2px}
  .req{gap:10px;padding:12px}.req .ic{width:38px;height:38px}
  nav button{font-size:10px}
  .card{padding:14px}
}
/* phones in landscape / short screens */
@media(max-height:480px) and (max-width:899px){
  nav{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
  nav button{flex-direction:row;justify-content:center;gap:6px}
  nav button.apply .fab{width:38px;height:38px;margin-top:-14px}
  #view{padding-bottom:70px}.cell{aspect-ratio:auto;height:34px}
  .sheet{max-height:94%}
}
/* large screens */
@media(min-width:1280px){
  nav{width:260px}#view{padding:0 64px 60px}#view>.page{max-width:1180px}
}
@media(min-width:1800px){html{font-size:18px}#view>.page{max-width:1360px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- manager additions ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi small{color:var(--mute);font-size:12px;display:block}
.kpi b{font-family:Fraunces,serif;font-size:30px;line-height:1.2}
.kpi.g{background:var(--grad);border:none;color:#fff}.kpi.g small{color:rgba(255,255,255,.8)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.tag.urgent{background:var(--red-l);color:var(--red)}.tag.soon{background:var(--amber-l);color:var(--amber)}.tag.ok{background:var(--green-l);color:var(--green)}.tag.info{background:var(--brand-l);color:var(--brand-d)}
.who{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.who .avatar{width:42px;height:42px;font-size:14px;flex:none}
.who .m{flex:1;min-width:0}.who .m b{display:block;font-size:15px}.who .m small{color:var(--mute);font-size:13px;display:block}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.btn.sm{width:auto;padding:10px 16px;font-size:14px;margin-top:0;border-radius:12px}
.btn.line{background:none;box-shadow:none;color:var(--brand);border:1.5px solid var(--line)}
.btn.ok{background:var(--green);box-shadow:none}
.btn.no{background:var(--red);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:var(--bg)}
tr:last-child td{border-bottom:none}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--grad)}
.more{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer}
.more span{flex:1}
.dOnly{display:none!important}.mOnly{display:flex}
@media(min-width:900px){.dOnly{display:flex!important}.mOnly{display:none!important}}
.hdr-actions{display:none}@media(min-width:900px){.hdr-actions{display:block}}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:4px;vertical-align:middle}
nav button{position:relative}
nav button .nb{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
@media(min-width:900px){nav button .nb{position:static;margin-left:auto}}
.gate{min-height:100%;display:grid;place-items:center;padding:20px}
.gate .card{width:100%;max-width:400px;padding:24px}
.gate .logo{width:48px;height:48px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-size:22px;margin-bottom:14px}
.lock{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:12px;background:var(--brand-l);color:var(--brand-d);font-size:13px;margin:14px 0 0}
.lock svg{flex:none;width:20px;height:20px}
.quick-r{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick-r button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.quick-r button:hover{border-color:var(--brand)}
.warn{background:var(--amber-l);color:var(--amber);padding:11px 14px;border-radius:12px;font-size:13px;font-weight:500;margin-top:12px}
.good{background:var(--green-l);color:var(--green);padding:11px 14px;border-radius:12px;font-size:13px;font-weight:500;margin-top:12px}
.dayc{display:flex;gap:2px;position:absolute;bottom:4px}
.dayc i{width:5px;height:5px;border-radius:50%;background:var(--brand)}
.dayc i.p{background:var(--amber)}.dayc i.w{background:var(--plum)}

/* sign-in gate + notices */
.gate{min-height:100%;display:grid;place-items:center;padding:20px}
.gate .card{width:100%;max-width:400px;padding:24px}
.gate .logo{width:48px;height:48px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-size:22px;margin-bottom:14px}
.lock{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:12px;background:var(--brand-l);color:var(--brand-d);font-size:13px;margin:14px 0 0}
.warnbox{background:var(--amber-l);color:var(--amber);padding:12px 14px;border-radius:14px;font-size:13px;font-weight:500;margin-bottom:12px}
.btn:disabled{cursor:not-allowed}

/* switch between views */
nav a.vlink{display:none}
@media(min-width:900px){nav a.vlink{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:var(--mute);padding:12px 14px;border-radius:13px;text-decoration:none}nav a.vlink:hover{background:var(--brand-l)}}

<body>
<div class="phone">
  <div id="view"></div>
  <nav id="nav"></nav>
  <div id="overlay"></div>
</div>

<script>
/* =============== API client (talks to the Cloudflare Worker + D1) =============== */
let LEAVE_TYPES={};   // { code: {label, active, quotas:{employee,manager}} } – set from the server
const quotaFor=(role,type)=>Number(((LEAVE_TYPES[type]||{}).quotas||{})[role==='employee'?'employee':'manager'])||0;
const blankDB=()=>({teams:[],emps:[],teamLeads:{},holidays:[],reqs:[],att:{},imports:[],audit:[]});
let DB=blankDB(), ME=null, NEEDS_SETUP=false, BOOTING=true;
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function api(method,url,body){
  let r;
  try{r=await fetch(url,{method,credentials:'same-origin',headers:{'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){const err=new Error('Can’t reach the server. Check your connection and try again.');err.status=0;throw err}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){
    const err=new Error(j.error||'Request failed ('+r.status+')');err.status=r.status;
    if(r.status===401&&!url.startsWith('/api/auth/')){ME=null;DB=blankDB();setTimeout(()=>{if(typeof PAGE!=='undefined'&&PAGE!=='login')goLogin()},0)}
    throw err;
  }
  return j;
}
async function loadState(){
  try{
    const s=await api('GET','/api/state');
    ME=s.me;
    LEAVE_TYPES=Object.fromEntries((s.leaveTypes||[]).map(t=>[t.code,{label:t.name,active:t.active,quotas:t.quotas}]));
    DB={teams:s.teams||[],emps:s.emps||[],teamLeads:s.teamLeads||{},holidays:s.holidays||[],reqs:s.reqs||[],att:s.att||{},imports:s.imports||[],audit:s.audit||[]};
    return true;
  }catch(e){
    if(e.status===401){ME=null;DB=blankDB();try{NEEDS_SETUP=(await api('GET','/api/auth/status')).needsSetup}catch(_){}return false}
    throw e;
  }
}
function usedDays(empId,type){const y=todayISO().slice(0,4);return DB.reqs.filter(r=>r.emp===empId&&r.kind==='leave'&&r.type===type&&r.status==='Approved'&&r.from.startsWith(y)).reduce((a,r)=>a+r.days,0)}
function pendingDays(empId,type){return DB.reqs.filter(r=>r.emp===empId&&r.kind==='leave'&&r.type===type&&r.status==='Pending').reduce((a,r)=>a+r.days,0)}

/* ---- sign in / first-time setup ---- */
function loginGate(title,sub,note){
  if(BOOTING)return `<div class="gate"><div class="card" style="text-align:center;color:var(--mute)">Loading…</div></div>`;
  const logo='<div class="logo">L</div>';
  if(NEEDS_SETUP){
    return `<div class="gate"><div class="card">${logo}<h1 style="font-size:26px">Set up LeaveDesk</h1>
      <p style="color:var(--mute);font-size:14px;margin-top:6px">Create the first administrator account. You can add everyone else afterwards.</p>
      <label class="f">Your name</label><input class="in" id="s_name" autocomplete="name">
      <label class="f">Email</label><input class="in" type="email" id="s_email" autocomplete="username">
      <label class="f">Password <small style="color:var(--mute)">(min 8 characters)</small></label><input class="in" type="password" id="s_pw" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitSetup()">
      <div id="g_err"></div><button class="btn" onclick="submitSetup()">Create administrator</button></div></div>`;
  }
  return `<div class="gate"><div class="card">${logo}<h1 style="font-size:26px">${title}</h1>
    ${sub?`<p style="color:var(--mute);font-size:14px;margin-top:6px">${sub}</p>`:''}
    ${note?`<div class="lock"><svg viewBox="0 0 24 24" style="width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><span>${note}</span></div>`:''}
    <label class="f">Email</label><input class="in" type="email" id="g_email" autocomplete="username" onkeydown="if(event.key==='Enter')$('#g_pw').focus()">
    <label class="f">Password</label><input class="in" type="password" id="g_pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitLogin()">
    <div id="g_err"></div><button class="btn" id="g_btn" onclick="submitLogin()">Sign in</button></div></div>`;
}
function gateError(m){const e=document.getElementById('g_err');if(e)e.innerHTML=`<div class="err">${String(m).replace(/</g,'&lt;')}</div>`}
async function submitLogin(){
  const email=document.getElementById('g_email').value.trim(),pw=document.getElementById('g_pw').value;
  if(!email||!pw)return gateError('Enter your email and password.');
  const b=document.getElementById('g_btn');b.disabled=true;
  try{await api('POST','/api/auth/login',{email,password:pw});await loadState();afterAuth()}
  catch(e){gateError(e.message);b.disabled=false}
}
async function submitSetup(){
  const name=document.getElementById('s_name').value.trim(),email=document.getElementById('s_email').value.trim(),pw=document.getElementById('s_pw').value;
  if(!name||!email||pw.length<8)return gateError('Enter your name, a valid email and a password of at least 8 characters.');
  try{await api('POST','/api/auth/setup',{name,email,password:pw});NEEDS_SETUP=false;await loadState();afterAuth()}
  catch(e){gateError(e.message)}
}
function afterAuth(){onAuthed()}
async function doLogout(){try{await api('POST','/api/auth/logout',{})}catch(e){}ME=null;DB=blankDB();location.replace('/')}
function deniedGate(title,msg){
  return `<div class="gate"><div class="card"><div class="logo">L</div><h1 style="font-size:24px">${title}</h1>
    <p style="color:var(--mute);font-size:14px;margin-top:8px">${msg}</p>
    <p style="font-size:13px;margin-top:10px">Signed in as <b>${String(ME&&ME.name||'').replace(/</g,'&lt;')}</b>.</p>
    <button class="btn" onclick="doLogout()">Sign out</button></div></div>`;
}
/* keep data fresh without a manual reload */
function softRefresh(){
  if(!ME||document.hidden)return;
  loadState().then(()=>{
    if(document.querySelector('#overlay .sheet'))return;
    if(['INPUT','TEXTAREA','SELECT'].includes((document.activeElement||{}).tagName))return;
    render();
  }).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)softRefresh()});
setInterval(softRefresh,60000);
/* ---- one login page, role decides the app ---- */
const HOME={admin:'/admin',manager:'/manager',employee:'/employee'};
const ACCESS={admin:['admin'],manager:['manager','admin'],employee:['employee','manager','admin']};
const APP_PATHS=['/admin','/manager','/employee'];
function appKey(path){return path.split('#')[0].split('?')[0].replace(/\.html$/,'').replace(/^\/+/,'')}
function goLogin(){location.replace('/?next='+encodeURIComponent(location.pathname+location.hash))}
function nextTarget(){
  const n=new URLSearchParams(location.search).get('next')||'';
  if(!n.startsWith('/')||n.startsWith('//'))return null;
  const k=appKey(n);
  if(!ACCESS[k]||!ME||!ACCESS[k].includes(ME.role))return null;
  return '/'+k+(n.includes('#')?n.slice(n.indexOf('#')):'');
}
function viewLinks(){
  if(!ME)return [];
  const all=[['admin','Admin','/admin'],['manager','Approvals','/manager'],['employee','My leave','/employee']];
  return all.filter(([k])=>k!==PAGE&&ACCESS[k].includes(ME.role));
}
const viewNav=()=>viewLinks().map(([k,l,h])=>`<a class="vlink" href="${h}">⇄ ${l}</a>`).join('');
function onAuthed(){if(ME&&ME.mustChange){render();return}location.replace(nextTarget()||HOME[ME.role])}
async function boot(){
  try{await loadState()}catch(e){}
  BOOTING=false;
  if(PAGE==='login'){
    if(ME){onAuthed();return}
    render();return;
  }
  if(!ME){goLogin();return}
  if(ME.mustChange){location.replace('/');return}
  if(!ACCESS[PAGE].includes(ME.role)){location.replace(HOME[ME.role]);return}
  render();
}

/* ---- password change (forced after first login, or any time) ---- */
function forcedPasswordGate(){
  return `<div class="gate"><div class="card"><div class="logo">L</div>
    <h1 style="font-size:24px">Choose your own password</h1>
    <p style="color:var(--mute);font-size:14px;margin-top:6px">You signed in with a temporary password. Set a new one to continue.</p>
    <label class="f">Temporary password</label><input class="in" type="password" id="p_cur" autocomplete="current-password">
    <label class="f">New password <small style="color:var(--mute)">(min 8 characters)</small></label><input class="in" type="password" id="p_new" autocomplete="new-password">
    <label class="f">Confirm new password</label><input class="in" type="password" id="p_new2" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitForcedPassword()">
    <div id="g_err"></div>
    <button class="btn" id="p_btn" onclick="submitForcedPassword()">Save and continue</button>
    <button class="btn ghost" style="color:var(--mute)" onclick="doLogout()">Sign out</button></div></div>`;
}
async function submitForcedPassword(){
  const cur=document.getElementById('p_cur').value,n1=document.getElementById('p_new').value,n2=document.getElementById('p_new2').value;
  if(!cur||!n1)return gateError('Fill in all the fields.');
  if(n1.length<8)return gateError('New password must be at least 8 characters.');
  if(n1!==n2)return gateError('The two new passwords don’t match.');
  const b=document.getElementById('p_btn');b.disabled=true;
  try{await api('POST','/api/auth/password',{current:cur,next:n1});await loadState();onAuthed()}
  catch(e){gateError(e.message);b.disabled=false}
}
function openChangePassword(){
  sheet(`<h2 style="font-size:22px">Change password</h2>
   <label class="f">Current password</label><input class="in" type="password" id="cp_cur" autocomplete="current-password">
   <label class="f">New password <small style="color:var(--mute)">(min 8 characters)</small></label><input class="in" type="password" id="cp_new" autocomplete="new-password">
   <label class="f">Confirm new password</label><input class="in" type="password" id="cp_new2" autocomplete="new-password">
   <div id="cp_err"></div>
   <button class="btn" onclick="doChangePassword()">Update password</button>`);
}
async function doChangePassword(){
  const f=id=>document.getElementById(id).value,err=m=>{document.getElementById('cp_err').innerHTML=`<div class="err">${String(m).replace(/</g,'&lt;')}</div>`};
  if(!f('cp_cur')||!f('cp_new'))return err('Fill in all the fields.');
  if(f('cp_new').length<8)return err('New password must be at least 8 characters.');
  if(f('cp_new')!==f('cp_new2'))return err('The two new passwords don’t match.');
  try{await api('POST','/api/auth/password',{current:f('cp_cur'),next:f('cp_new')});closeSheet();toast('Password updated')}
  catch(e){err(e.message)}
}
function openPhone(){
  sheet(`<h2 style="font-size:22px">Your WhatsApp number</h2>
   <p style="color:var(--mute);font-size:14px;margin-top:6px">Used so your manager or team can message you on WhatsApp about requests. Include the country code, for example 919876543210.</p>
   <label class="f">WhatsApp number</label><input class="in" type="tel" id="ph_val" value="${String(ME&&ME.phone||'').replace(/"/g,'')}" placeholder="919876543210">
   <div id="ph_err"></div><button class="btn" onclick="savePhone()">Save number</button>`);
}
async function savePhone(){
  try{await api('POST','/api/me/phone',{phone:document.getElementById('ph_val').value});await loadState();closeSheet();render();toast('Number saved')}
  catch(e){document.getElementById('ph_err').innerHTML=`<div class="err">${String(e.message).replace(/</g,'&lt;')}</div>`}
}

/* ---- WhatsApp: prefilled message, the person just presses send ---- */
const waDigits=p=>String(p||'').replace(/\D/g,'');
const waUrl=(phone,text)=>`https://wa.me/${waDigits(phone)}?text=${encodeURIComponent(text)}`;
const _fd=s=>new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const waRange=r=>r.from===r.to?_fd(r.from):`${_fd(r.from)} – ${_fd(r.to)}`;
const waKind=r=>r.kind==='wfh'?'work from home':((LEAVE_TYPES[r.type]||{label:'Leave'}).label.toLowerCase()+' leave');
const reviewLink=no=>`${location.origin}/manager#/review/${no}`;
function showWhatsApp(title,toName,phone,text){
  const ok=waDigits(phone).length>=8, url=ok?waUrl(phone,text):'';
  const safe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  sheet(`<div style="text-align:center;padding:6px 0">
    <div style="width:60px;height:60px;border-radius:50%;background:var(--green-l);color:var(--green);display:grid;place-items:center;margin:0 auto 12px;font-size:28px">✓</div>
    <h2 style="font-size:22px">${safe(title)}</h2>
    ${ok?`<p style="color:var(--mute);font-size:14px;margin:8px 0 12px">Your message to ${safe(toName)} is ready in WhatsApp. Just press send there.</p>
      <div class="card" style="text-align:left;font-size:14px;white-space:pre-wrap">${safe(text)}</div>
      <a class="btn" style="display:block;text-decoration:none;text-align:center;background:#25D366;box-shadow:none" href="${url}" target="_blank" rel="noopener">Open WhatsApp</a>`
     :`<p style="color:var(--mute);font-size:14px;margin:8px 0 12px">${safe(toName)} has no WhatsApp number saved, so a chat can’t be opened. Ask your admin to add it.</p>`}
    <button class="btn ghost" style="color:var(--mute)" onclick="closeSheet()">Close</button></div>`);
  if(ok){try{window.open(url,'_blank','noopener')}catch(e){}}
}



/* =============== manager app =============== */
const TODAY=todayISO();
const TLABEL=new Proxy({},{get:(_,k)=>(LEAVE_TYPES[k]&&LEAVE_TYPES[k].label)||String(k)});
const typeCodes=()=>Object.keys(LEAVE_TYPES).filter(k=>LEAVE_TYPES[k].active);
const PAGE='manager';
const $=s=>document.querySelector(s);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const P=s=>new Date(s+'T00:00');
const fmt=(s,o={day:'numeric',month:'short'})=>P(s.slice(0,10)).toLocaleDateString('en-GB',o);
const range=r=>r.from===r.to?fmt(r.from):`${fmt(r.from)} – ${fmt(r.to)}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const person=id=>DB.emps.find(p=>p.id===id)||{id,name:'Former employee',desig:'',team:'',active:false};
const nameOf=id=>person(id).name;
const holMap=()=>Object.fromEntries(DB.holidays.map(h=>[h.d,h.n]));
const daysBetween=(a,b)=>Math.round((P(b)-P(a))/864e5);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('.phone').appendChild(t);setTimeout(()=>t.remove(),3000)}
function closeSheet(){$('#overlay').innerHTML=''}
function sheet(html){$('#overlay').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="grab"></div>${html}</div></div>`}
const ICON={
 grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.500l2.700 2.700L16 9.500"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>',
 users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 010 8M22 21c0-3-2-5-4-5.500"/>',
 more:'<circle cx="5" cy="12" r="1.500"/><circle cx="12" cy="12" r="1.500"/><circle cx="19" cy="12" r="1.500"/>',
 chart:'<path d="M3 21h18M6 17v-5M11 17V7M16 17v-8M21 17V4"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 right:'<path d="M9 18l6-6-6-6"/>',left:'<path d="M15 18l-6-6 6-6"/>',
 out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
 lock:'<rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 018 0v4"/>',
};
const ic=n=>`<svg viewBox="0 0 24 24">${ICON[n]}</svg>`;

/* =============== state =============== */
let meId=null;
let tab='home', pendingLink=null;
let apFilter='Pending', apKind='All';
let calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1), calSel=null;
const me=()=>ME&&['manager','admin'].includes(ME.role)?ME:null;
const mine=()=>DB.reqs.filter(r=>r.appr===meId);
const team=()=>DB.emps.filter(p=>p.mgr===meId&&p.active);
const remaining=(p,type)=>quotaFor(p.role,type)-usedDays(p.id,type);
function go(t){tab=t;closeSheet();render();$('#view').scrollTop=0}

/* =============== secure link + sign in =============== */
function readHash(){
  const m=location.hash.match(/review\/([A-Z]+-\d{4}-\d+)/i);
  pendingLink=m?m[1].toUpperCase():null;
}
window.addEventListener('hashchange',()=>{readHash();if(me()&&pendingLink){render();openReview(pendingLink)}else render()});
function vGate(){
  if(ME&&!me())return deniedGate('This page is for managers','Your account doesn’t have the manager role. Use the employee app instead.');
  return loginGate('Manager sign in',pendingLink?`You opened a review link for <b>${esc(pendingLink)}</b>. Sign in to continue.`:'Sign in to review your team’s requests.',
    'The link alone gives no access. After sign-in we check that <b>you</b> are the assigned approver.');
}
function onAuthed(){
  tab='home';
  if(pendingLink){tab='approvals';apFilter='All';render();openReview(pendingLink)}else render();
}

/* =============== home =============== */
function status(p,ds){
  const r=DB.reqs.find(x=>x.emp===p.id&&x.status==='Approved'&&ds>=x.from&&ds<=x.to);
  return r?(r.kind==='wfh'?{s:'WFH',r}:{s:'Leave',r}):null;
}
function urgency(r){
  const d=daysBetween(TODAY,r.from);
  if(d<=0)return ['urgent','Starts today'];
  if(d===1)return ['urgent','Starts tomorrow'];
  if(d<=3)return ['soon',`In ${d} days`];
  return null;
}
function pendRow(r){
  const p=person(r.emp),u=urgency(r);
  return `<div class="card who" onclick="openReview('${r.no}')"><div class="avatar">${ini(p.name)}</div>
   <div class="m"><b>${esc(p.name)}</b><small>${r.kind==='wfh'?'Work from home':TLABEL[r.type]+' leave'} · ${range(r)} · ${r.days} day${r.days===1?'':'s'}</small></div>
   ${u?`<span class="tag ${u[0]}">${u[1]}</span>`:`<span class="pill ${r.status}">${r.status}</span>`}</div>`;
}
function vHome(){
  const pend=mine().filter(r=>r.status==='Pending').sort((a,b)=>a.from.localeCompare(b.from));
  const away=team().map(p=>[p,status(p,TODAY)]).filter(x=>x[1]);
  const wfh=away.filter(x=>x[1].s==='WFH').length, leave=away.length-wfh;
  const week=[];for(let i=1;i<=7;i++){const d=new Date(P(TODAY));d.setDate(d.getDate()+i);const ds=iso(d);
    const who=team().filter(p=>DB.reqs.some(r=>r.emp===p.id&&r.status==='Approved'&&r.kind==='leave'&&ds>=r.from&&ds<=r.to));
    if(who.length)week.push([ds,who])}
  const m=me(), dateStr=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  return `<header class="top"><div class="t"><small>${dateStr}</small><h1>Hi, ${esc(m.name.split(' ')[0])} 👋</h1></div><button class="avatar" onclick="go('profile')">${ini(m.name)}</button></header>
  ${team().length?'':'<div class="warn" style="margin-top:0;margin-bottom:12px">Nobody reports to you yet. An admin can assign people to you in Teams &amp; Reporting.</div>'}
  <div class="kpis">
    <div class="kpi g"><small>Waiting for you</small><b>${pend.length}</b></div>
    <div class="kpi"><small>Away today</small><b style="color:var(--brand)">${leave}</b></div>
    <div class="kpi"><small>WFH today</small><b style="color:var(--plum)">${wfh}</b></div>
    <div class="kpi"><small>Team size</small><b>${team().length}</b></div></div>
  <div class="cols"><div>
    <div class="sec" style="margin-top:6px"><h2>Needs your decision</h2><a onclick="go('approvals')">See all</a></div>
    ${pend.length?pend.slice(0,4).map(pendRow).join(''):'<div class="card" style="text-align:center;padding:26px;color:var(--mute)">🎉 All caught up. No pending requests.</div>'}
  </div><div>
    <div class="sec" style="margin-top:6px"><h2>Today</h2></div>
    ${away.length?away.map(([p,s])=>`<div class="card who" style="cursor:default"><div class="avatar">${ini(p.name)}</div><div class="m"><b>${esc(p.name)}</b><small>${s.s==='WFH'?'Working from home':TLABEL[s.r.type]+' leave'}</small></div><span class="tag ${s.s==='WFH'?'info':'ok'}">${s.s}</span></div>`).join(''):'<div class="card" style="color:var(--mute);text-align:center">Nobody is away today.</div>'}
    <div class="sec"><h2>Coming up this week</h2><a onclick="go('calendar')">Calendar</a></div>
    ${week.length?week.map(([ds,who])=>`<div class="card hol"><div class="d"><b>${P(ds).getDate()}</b><small>${P(ds).toLocaleDateString('en-GB',{weekday:'short'})}</small></div><div class="m"><b>${who.map(p=>esc(p.name.split(' ')[0])).join(', ')}</b><small>on leave</small></div></div>`).join(''):'<div class="card" style="color:var(--mute);text-align:center">No planned leave this week.</div>'}
  </div></div>`;
}

/* =============== approvals =============== */
function vApprovals(){
  const all=mine();
  const list=all.filter(r=>(apFilter==='All'||r.status===apFilter)&&(apKind==='All'||r.kind===apKind.toLowerCase()))
    .sort((a,b)=>apFilter==='Pending'?a.from.localeCompare(b.from):b.created.localeCompare(a.created));
  const fs=['Pending','Approved','Rejected','All'];
  return `<header class="top"><div class="t"><small>Leave and WFH from your team</small><h1>Approvals</h1></div></header>
  <div class="filters">${fs.map(f=>`<button class="fl ${apFilter===f?'on':''}" onclick="apFilter='${f}';render()">${f}${f!=='All'?` · ${all.filter(r=>r.status===f).length}`:''}</button>`).join('')}</div>
  <div class="seg">${['All','Leave','WFH'].map(k=>`<button class="${apKind===k?'on':''}" onclick="apKind='${k}';render()">${k}</button>`).join('')}</div>
  ${list.length?`<div class="list2">${list.map(r=>{const p=person(r.emp),u=r.status==='Pending'?urgency(r):null;
    return `<div class="card who" onclick="openReview('${r.no}')"><div class="avatar">${ini(p.name)}</div>
      <div class="m"><b>${esc(p.name)}</b><small>${r.kind==='wfh'?'Work from home':TLABEL[r.type]+' leave'} · ${range(r)}</small><small>${r.days} day${r.days===1?'':'s'} · ${esc(r.no)}</small></div>
      <div style="text-align:right"><span class="pill ${r.status}">${r.status}</span>${u?`<br><span class="tag ${u[0]}" style="margin-top:6px">${u[1]}</span>`:''}</div></div>`}).join('')}</div>`
   :`<div class="empty">Nothing here.</div>`}`;
}
function conflicts(r){
  const p=person(r.emp);
  return DB.reqs.filter(x=>x.no!==r.no&&x.emp!==r.emp&&person(x.emp).team===p.team&&['Approved','Pending'].includes(x.status)&&x.from<=r.to&&x.to>=r.from);
}
function openReview(no){
  const r=DB.reqs.find(x=>x.no===no);
  if(!me()){pendingLink=no;render();return}
  if(!r){sheet(`<h2 style="font-size:22px">Request not found</h2><p style="color:var(--mute);margin-top:8px">No request with ID ${esc(no)}.</p><button class="btn" onclick="closeSheet()">Close</button>`);return}
  if(r.appr!==meId){
    sheet(`<div style="text-align:center;padding:10px 0"><div style="width:60px;height:60px;border-radius:50%;background:var(--red-l);color:var(--red);display:grid;place-items:center;margin:0 auto 12px">${ic('lock')}</div>
      <h2 style="font-size:22px">You can’t review this request</h2>
      <p style="color:var(--mute);margin-top:8px;font-size:14px">${esc(r.no)} is assigned to <b>${esc(nameOf(r.appr))}</b>. You’re signed in as <b>${esc(me().name)}</b>. Having the link isn’t enough, only the assigned approver can open it.</p>
      <button class="btn" onclick="closeSheet()">Close</button></div>`);
    return;
  }
  const p=person(r.emp), isL=r.kind==='leave', pend=r.status==='Pending';
  const rem=isL?remaining(p,r.type):null, short=isL&&r.days>rem;
  const cf=conflicts(r);
  const teamSize=Math.max(team().length,1);
  const away=new Set(cf.map(x=>x.emp)).size+1;
  const colors={Submitted:'var(--amber)',Approved:'var(--green)',Rejected:'var(--red)',Cancelled:'var(--mute)'};
  sheet(`<div class="row" style="align-items:flex-start"><div style="flex:1"><h2 style="font-size:22px">${esc(p.name)}</h2><small style="color:var(--mute)">${esc(p.desig||'')} · ${esc(r.no)}</small></div><span class="pill ${r.status}" style="flex:none">${r.status}</span></div>
   <div class="card" style="margin-top:14px;padding:6px 16px">
     <div class="kv"><span>Type</span><b>${r.kind==='wfh'?'Work from home':TLABEL[r.type]+' leave'}</b></div>
     <div class="kv"><span>Dates</span><b>${range(r)}</b></div>
     <div class="kv"><span>Duration</span><b>${r.days} day${r.days===1?'':'s'}${r.half?' (half day)':''}</b></div>
     <div class="kv"><span>Applied</span><b>${fmt(r.created)}</b></div>
     <div class="kv"><span>Reason</span><b style="max-width:62%;text-align:right">${esc(r.reason)}</b></div></div>
   ${isL?`<div class="card"><div class="row"><b style="flex:none;font-size:14px">${TLABEL[r.type]} balance</b><span style="text-align:right;font-size:14px"><b>${rem}</b> left → <b style="color:${short?'var(--red)':'var(--green)'}">${short?'short by '+(r.days-rem):rem-r.days}</b></span></div>
     <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,usedDays(p.id,r.type)/(quotaFor(p.role,r.type)||1)*100)}%"></i></div>
     <small style="color:var(--mute)">${usedDays(p.id,r.type)} of ${quotaFor(p.role,r.type)} used this year. Deducted only on approval.</small></div>`:''}
   ${cf.length?`<div class="warn"><b>${cf.length} overlapping request${cf.length===1?'':'s'} in the team</b><br>${cf.map(x=>`${esc(person(x.emp).name)} · ${range(x)} <small>(${x.status.toLowerCase()})</small>`).join('<br>')}<br><small>If approved, ${away} of ${teamSize} would be away.</small></div>`:`<div class="good">No overlaps with the team on these dates.</div>`}
   ${short&&pend?`<div class="err">Not enough ${TLABEL[r.type].toLowerCase()} balance. Approval is blocked. Ask the employee to change type or dates, or contact HR.</div>`:''}
   ${r.rej?`<div class="err"><b>Rejection reason</b><br>${esc(r.rej)}</div>`:''}
   <div class="sec" style="margin:16px 2px 6px"><h2 style="font-size:16px">History</h2></div>
   <div class="tl">${r.hist.map(([a,t])=>`<div style="--c:${colors[a.split(' ')[0]]||'var(--mute)'}">${esc(a)}<small>${esc(t)}</small></div>`).join('')}</div>
   ${pend?`<div id="rj" style="display:none"><label class="f">Reason for rejection <small style="color:var(--mute)">(shown to ${esc(p.name.split(' ')[0])})</small></label>
      <textarea class="in" id="rj_text" placeholder="Explain briefly…"></textarea>
      <div class="quick-r">${['Team deadline that week','Too many people away','Please choose different dates','Need more details'].map(s=>`<button onclick="$('#rj_text').value='${s}'">${s}</button>`).join('')}</div>
      <div id="rj_err"></div>
      <div class="row" style="margin-top:14px"><button class="btn line" style="margin-top:0" onclick="$('#rj').style.display='none';$('#acts').style.display='flex'">Back</button><button class="btn no" style="margin-top:0" onclick="doReject('${r.no}')">Confirm reject</button></div></div>
     <div id="acts" class="row" style="margin-top:18px"><button class="btn line" style="margin-top:0" onclick="$('#acts').style.display='none';$('#rj').style.display='block'">Reject</button><button class="btn ok" style="margin-top:0" ${short?'disabled':''} onclick="doApprove('${r.no}')">Approve</button></div>`:''}
   ${!pend&&r.status!=='Cancelled'?`<button class="btn" style="margin-top:12px;background:#25D366;box-shadow:none" onclick="messageEmployee('${r.no}')">Message ${esc(p.name.split(' ')[0])} on WhatsApp</button>`:''}
   <button class="btn line" style="margin-top:12px" onclick="copyLink('${r.no}')">Copy secure review link</button>`);
}
function copyLink(no){
  const url=location.href.split('#')[0]+'#/review/'+no;
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Link copied. Opening it still requires sign-in.'),()=>toast(url));
}
function messageEmployee(no,verb){
  const r=DB.reqs.find(x=>x.no===no);if(!r)return;
  const p=person(r.emp),first=p.name.split(' ')[0];
  const v=verb||(r.status==='Approved'?'approved':r.status==='Rejected'?'rejected':null);
  if(!v){toast('This request is still pending');return}
  const msg=`Hi ${first}, your ${waKind(r)} request ${r.no} for ${waRange(r)} has been ${v}.${v==='rejected'&&r.rej?`\nReason: ${r.rej}`:''}\n– ${ME.name}`;
  showWhatsApp(`Request ${v}`,p.name,p.phone,msg);
}
async function doApprove(no){
  const r0=DB.reqs.find(x=>x.no===no);if(!r0)return;
  const p=person(r0.emp);
  if(r0.kind==='leave'&&r0.days>remaining(p,r0.type)){toast('Insufficient balance');return}
  try{
    await api('POST',`/api/requests/${encodeURIComponent(no)}/approve`,{});
    await loadState();closeSheet();render();toast('Approved');
    messageEmployee(no,'approved');
  }catch(err){toast(err.message);try{await loadState()}catch(_){}closeSheet();render()}
}
async function doReject(no){
  const t=$('#rj_text').value.trim();
  if(!t){$('#rj_err').innerHTML='<div class="err">A reason is required to reject.</div>';return}
  const r0=DB.reqs.find(x=>x.no===no);
  try{
    await api('POST',`/api/requests/${encodeURIComponent(no)}/reject`,{reason:t});
    await loadState();closeSheet();render();toast('Rejected');
    messageEmployee(no,'rejected');
  }catch(err){toast(err.message);try{await loadState()}catch(_){}closeSheet();render()}
}

/* =============== calendar =============== */
function vCalendar(){
  const first=new Date(calMonth.getFullYear(),calMonth.getMonth(),1),n=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,0).getDate();
  const off=(first.getDay()+6)%7, hm=holMap();
  const tm=new Set(team().map(p=>p.id));
  const rows=DB.reqs.filter(r=>tm.has(r.emp)&&['Approved','Pending'].includes(r.status));
  let g=['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('')+'<div></div>'.repeat(off);
  for(let i=1;i<=n;i++){
    const ds=iso(new Date(calMonth.getFullYear(),calMonth.getMonth(),i)),dw=P(ds).getDay(),we=dw===0||dw===6;
    const rs=we?[]:rows.filter(r=>ds>=r.from&&ds<=r.to);
    const dots=rs.slice(0,4).map(r=>`<i class="${r.status==='Pending'?'p':r.kind==='wfh'?'w':''}"></i>`).join('');
    g+=`<button class="cell ${we?'we':''} ${hm[ds]?'hol':''} ${ds===TODAY?'today':''} ${calSel===ds?'sel':''}" onclick="calSel='${ds}';render()">${i}<span class="dayc">${dots}</span></button>`;
  }
  let det='';
  if(calSel){
    const rs=rows.filter(r=>calSel>=r.from&&calSel<=r.to&&![0,6].includes(P(calSel).getDay()));
    det=`<div class="card"><b>${fmt(calSel,{weekday:'long',day:'numeric',month:'long'})}</b>${hm[calSel]?`<br><small style="color:var(--brand)">${esc(hm[calSel])}</small>`:''}
      ${rs.length?rs.map(r=>`<div class="row" style="margin-top:10px;cursor:pointer" onclick="openReview('${r.no}')"><div style="flex:1"><b style="font-size:14px">${esc(person(r.emp).name)}</b><br><small style="color:var(--mute)">${r.kind==='wfh'?'WFH':TLABEL[r.type]+' leave'}</small></div><span class="pill ${r.status}" style="flex:none">${r.status}</span></div>`).join(''):'<br><small style="color:var(--mute)">Nobody away.</small>'}</div>`;
  }
  const mh=[...DB.holidays].sort((a,b)=>a.d.localeCompare(b.d)).filter(h=>h.d.startsWith(iso(calMonth).slice(0,7)));
  return `<header class="top"><div class="t"><small>${esc(me().team||'Your')} team</small><h1>Team calendar</h1></div></header>
  <div class="cols"><div><div class="card"><div class="calhead"><button class="iconbtn" onclick="calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);calSel=null;render()">${ic('left')}</button><b>${calMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button class="iconbtn" onclick="calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);calSel=null;render()">${ic('right')}</button></div>
  <div class="grid">${g}</div>
  <div class="legend"><span style="--c:var(--brand)">Leave</span><span style="--c:var(--amber)">Pending</span><span style="--c:var(--plum)">WFH</span></div></div>${det}</div>
  <div><div class="sec" style="margin-top:0"><h2>Holidays this month</h2></div>
  ${mh.length?mh.map(h=>`<div class="card hol"><div class="d"><b>${P(h.d).getDate()}</b><small>${P(h.d).toLocaleDateString('en-GB',{month:'short'})}</small></div><div class="m"><b>${esc(h.n)}</b><small>${P(h.d).toLocaleDateString('en-GB',{weekday:'long'})}</small></div></div>`).join(''):'<div class="card" style="color:var(--mute);text-align:center">No holidays this month.</div>'}</div></div>`;
}

/* =============== team =============== */
function vTeam(){
  const t=team();
  return `<header class="top"><div class="t"><small>${esc(me().team||'No team')} · ${t.length} ${t.length===1?'person':'people'}</small><h1>My team</h1></div></header>
  ${t.length?`<div class="list2">${t.map(p=>{const s=status(p,TODAY),pe=DB.reqs.filter(r=>r.emp===p.id&&r.status==='Pending').length;
   return `<div class="card who" onclick="openMember('${p.id}')"><div class="avatar">${ini(p.name)}</div><div class="m"><b>${esc(p.name)}</b><small>${esc(p.desig||'')}</small><small>Annual: ${remaining(p,'annual')} left${pe?` · ${pe} pending`:''}</small></div>
    <span class="tag ${s?(s.s==='WFH'?'info':'soon'):'ok'}">${s?s.s:'In'}</span></div>`}).join('')}</div>`
   :'<div class="empty">Nobody reports to you yet.</div>'}`;
}
function openMember(id){
  const p=person(id),rs=DB.reqs.filter(r=>r.emp===id).sort((a,b)=>b.from.localeCompare(a.from));
  sheet(`<div class="row"><div class="avatar" style="flex:none;width:52px;height:52px">${ini(p.name)}</div><div style="flex:1"><h2 style="font-size:22px">${esc(p.name)}</h2><small style="color:var(--mute)">${esc(p.desig||'')} · ${esc(p.id)}</small></div></div>
   <div class="card" style="margin-top:14px">${typeCodes().filter(t=>quotaFor(p.role,t)>0).map(t=>`<div style="margin-bottom:12px"><div class="row"><b style="font-size:14px">${TLABEL[t]}</b><span style="text-align:right;font-size:13px;color:var(--mute)">${Math.max(0,remaining(p,t))} of ${quotaFor(p.role,t)} left</span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,usedDays(p.id,t)/quotaFor(p.role,t)*100)}%"></i></div></div>`).join('')}</div>
   <div class="sec" style="margin:14px 2px 8px"><h2 style="font-size:16px">Recent requests</h2></div>
   ${rs.slice(0,5).map(r=>`<div class="card who" onclick="openReview('${r.no}')"><div class="m"><b>${r.kind==='wfh'?'Work from home':TLABEL[r.type]+' leave'}</b><small>${range(r)} · ${r.days} day${r.days===1?'':'s'}</small></div><span class="pill ${r.status}">${r.status}</span></div>`).join('')||'<div class="empty">No requests yet.</div>'}`);
}

/* =============== reports =============== */
function vReports(){
  const t=team(), ym=TODAY.slice(0,7);
  const tot=typeCodes().map(k=>[k,t.reduce((a,p)=>a+usedDays(p.id,k),0),t.reduce((a,p)=>a+quotaFor(p.role,k),0)]).filter(x=>x[2]>0||x[1]>0);
  const wfh=DB.reqs.filter(r=>r.kind==='wfh'&&r.status==='Approved'&&t.some(p=>p.id===r.emp)&&r.from.startsWith(ym));
  const monthName=new Date().toLocaleDateString('en-GB',{month:'long'});
  return `<header class="top"><div class="t"><small>${esc(me().team||'Your team')} · ${new Date().getFullYear()}</small><h1>Reports</h1></div></header>
  <div class="kpis"><div class="kpi g"><small>Leave days used</small><b>${tot.reduce((a,x)=>a+x[1],0)}</b></div>
   <div class="kpi"><small>Approved this month</small><b style="color:var(--green)">${mine().filter(r=>r.status==='Approved'&&r.created.startsWith(ym)).length}</b></div>
   <div class="kpi"><small>Rejected (all time)</small><b style="color:var(--red)">${mine().filter(r=>r.status==='Rejected').length}</b></div>
   <div class="kpi"><small>WFH days (${monthName})</small><b style="color:var(--plum)">${wfh.reduce((a,r)=>a+r.days,0)}</b></div></div>
  ${t.length?`<div class="cols"><div><div class="sec" style="margin-top:6px"><h2>Leave used by type</h2></div>
  ${tot.map(([k,u,c])=>`<div class="card"><div class="row"><b>${TLABEL[k]}</b><span style="text-align:right;color:var(--mute);font-size:13px">${u} of ${c} days</span></div><div class="bar" style="margin-top:10px"><i style="width:${c?u/c*100:0}%"></i></div></div>`).join('')}</div>
  <div><div class="sec" style="margin-top:6px"><h2>By person</h2></div>
  <div class="tablewrap"><table><tr><th>Name</th>${typeCodes().map(k=>`<th>${esc(TLABEL[k])}</th>`).join('')}<th>Pending</th></tr>
  ${t.map(p=>`<tr><td>${esc(p.name)}</td>${typeCodes().map(k=>`<td>${Math.max(0,remaining(p,k))}</td>`).join('')}<td>${DB.reqs.filter(r=>r.emp===p.id&&r.status==='Pending').length}</td></tr>`).join('')}</table></div>
  <p style="color:var(--mute);font-size:12px;margin-top:8px">Balances show days remaining.</p></div></div>`:'<div class="empty">Reports appear once people report to you.</div>'}`;
}

/* =============== profile + shell =============== */
function vProfile(){
  const m=me();
  return `<header class="top"><div class="t"><small>Signed in</small><h1>Profile</h1></div></header>
  <div class="prof"><div class="avatar">${ini(m.name)}</div><h1>${esc(m.name)}</h1><p>${esc(m.desig||'Manager')}</p></div>
  <div class="card" style="margin-top:18px;padding:6px 16px">
   <div class="kv"><span>Employee ID</span><b>${esc(m.id)}</b></div><div class="kv"><span>Email</span><b>${esc(m.email)}</b></div>
   <div class="kv"><span>Team</span><b>${esc(m.team||'—')}</b></div><div class="kv"><span>Direct reports</span><b>${team().length}</b></div><div class="kv"><span>Role</span><b>${esc(m.role)}</b></div></div>
  <button class="btn line" onclick="openPhone()">WhatsApp number${m.phone?' · '+esc(m.phone):''}</button>
  <button class="btn line" onclick="openChangePassword()">Change password</button>
  <button class="btn line" onclick="doLogout()">Sign out</button>`;
}
function openMore(){
  sheet(`<h2 style="font-size:22px;margin-bottom:6px">More</h2>
   <div class="more" onclick="go('reports')">${ic('chart')}<span>Reports</span>${ic('right')}</div>
   <div class="more" onclick="go('profile')">${ic('user')}<span>Profile</span>${ic('right')}</div>
   ${viewLinks().map(([k,l,h])=>`<a class="more" href="${h}" style="text-decoration:none;color:inherit">${ic('right')}<span>Switch to ${l}</span>${ic('right')}</a>`).join('')}
   <div class="more" style="color:var(--red);border:none" onclick="doLogout()">${ic('out')}<span>Sign out</span></div>`);
}
const VIEWS={home:vHome,approvals:vApprovals,calendar:vCalendar,team:vTeam,reports:vReports,profile:vProfile};
function render(){
  meId=ME?ME.id:null;
  const st=$('#view').scrollTop;
  if(!me()){$('#view').innerHTML=vGate();$('#nav').style.display='none';return}
  $('#nav').style.display='';
  $('#view').innerHTML='<div class="page'+(tab==='profile'?' narrow':'')+'">'+VIEWS[tab]()+'</div>';
  $('#view').scrollTop=st;
  const pc=mine().filter(r=>r.status==='Pending').length;
  const items=[['home','Home','grid',''],['approvals','Approvals','check',''],['calendar','Calendar','cal',''],['team','Team','users',''],['reports','Reports','chart','dOnly'],['profile','Profile','user','dOnly']];
  $('#nav').innerHTML='<div class="brand"><i>L</i>LeaveDesk <span style="font-size:11px;font-family:DM Sans;color:var(--mute);margin-left:2px">Manager</span></div>'
   +items.map(([k,l,i,c])=>`<button class="${tab===k?'on':''} ${c}" onclick="go('${k}')">${ic(i)}${l}${k==='approvals'&&pc?`<span class="nb">${pc}</span>`:''}</button>`).join('')
   +viewNav()+`<button class="mOnly ${['reports','profile'].includes(tab)?'on':''}" onclick="openMore()">${ic('more')}More</button>`
   +`<button class="sidelink" onclick="doLogout()">${ic('out')}Sign out</button>`;
}
readHash();boot().then(()=>{if(me()&&pendingLink){tab='approvals';apFilter='All';render();openReview(pendingLink)}});

</script>
