<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4bdb">
<title>Leave App – Employee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2fb; --card:#fff; --ink:#1e1b33; --mute:#716d8c; --line:#e7e3f4;
  --brand:#5b4bdb; --brand-d:#4333b8; --brand-l:#ece9fd; --grad:linear-gradient(135deg,#5b4bdb 0%,#8a4fe0 55%,#d0408f 100%);
  --amber:#b86e00; --amber-l:#fff0d1; --green:#13875a; --green-l:#dcf5e8;
  --red:#d6405a; --red-l:#fde6ea; --blue:#0e8fa3; --blue-l:#dff3f6; --plum:#c0398f; --plum-l:#fae4f2;
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12101f;--card:#1c1930;--ink:#f0eefc;--mute:#a09cc0;--line:#2d2947;--brand:#8b7dff;--brand-d:#b4a9ff;--brand-l:#2a2550;
  --amber-l:#3b2e12;--green-l:#143a2a;--red-l:#3d1b25;--blue-l:#12333a;--plum-l:#3a1b33;--amber:#f0b04a;--green:#52d49a;--red:#ff7b91;--blue:#4fc8dc;--plum:#ee7cc4}
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;min-width:0}
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,textarea{max-width:100%}
.m b,.hol .m b{overflow-wrap:anywhere}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.phone{width:100%;height:100vh;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;overflow-y:auto;padding:0 16px 110px;scroll-behavior:smooth}
#view>.page{max-width:1080px;margin:0 auto}
.narrow{max-width:620px;margin:0 auto}
.cols{display:block}
.list2{display:block}
.brand,.sidelink{display:none}
.toast{max-width:420px;margin:0 auto}
#view::-webkit-scrollbar{display:none}
h1,h2,.serif{font-family:Fraunces,serif;font-weight:600}
header.top{display:flex;align-items:center;gap:12px;padding:20px 0 14px}
header.top .t{flex:1}
header.top .t small{color:var(--mute);font-size:13px;display:block}
header.top .t h1{font-size:24px;line-height:1.15}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;border:none;cursor:pointer;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px}
.sec h2{font-size:18px}.sec a{font-size:13px;color:var(--brand);font-weight:600;cursor:pointer}
.hero{background:var(--grad);color:#fff;border:none;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{opacity:.8;font-size:13px}
.hero .big{font-family:Fraunces,serif;font-size:40px;line-height:1.1;margin:4px 0 12px}
.hero .row{display:flex;gap:8px}
.hero .chip{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;font-size:13px;flex:1}
.hero .chip b{display:block;font-size:17px}
.balances{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bal{text-align:center;padding:14px 6px}
.ring{width:62px;height:62px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:16px}
.bal small{color:var(--mute);font-size:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.qa b{font-size:15px}.qa small{color:var(--mute);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.Pending{background:var(--amber-l);color:var(--amber)}
.pill.Approved{background:var(--green-l);color:var(--green)}
.pill.Rejected{background:var(--red-l);color:var(--red)}
.pill.Cancelled{background:var(--line);color:var(--mute)}
.req{display:flex;gap:12px;align-items:center;cursor:pointer;padding:14px}
.req .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.req .m{flex:1;min-width:0}.req .m b{display:block;font-size:15px}.req .m small{color:var(--mute);font-size:13px}
.hol{display:flex;gap:12px;align-items:center;padding:12px 14px}
.hol .d{width:46px;text-align:center;border-radius:12px;background:var(--brand-l);color:var(--brand-d);padding:6px 0;flex:none}
.hol .d b{display:block;font-size:18px;line-height:1}.hol .d small{font-size:11px;text-transform:uppercase;font-weight:600}
.hol .m b{display:block;font-size:14px}.hol .m small{color:var(--mute);font-size:12px}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
#view{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.qa,.type,.fl,.menu,.req{min-height:44px}
nav button{flex:1;border:none;background:none;color:var(--mute);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0}
nav button.on{color:var(--brand)}
nav button.apply .fab{width:50px;height:50px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(91,75,219,.45);border:4px solid var(--bg)}
nav button.apply{color:var(--brand)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* forms */
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:none;background:none;padding:10px;border-radius:11px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.in{width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.in:focus{outline:none;border-color:var(--brand)}
textarea.in{resize:none;height:90px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.type b{display:block;font-size:13px}.type small{color:var(--mute);font-size:11px}
.type.on{border-color:var(--brand);background:var(--brand-l)}
.toggle{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--card)}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--grad)}.sw.on:after{left:23px}
.mgr{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:13px;background:var(--brand-l);margin-top:14px;font-size:13px}
.mgr .avatar{width:34px;height:34px;font-size:12px}
.sum{margin-top:14px;padding:14px;border-radius:13px;border:1.5px dashed var(--line);font-size:14px}
.sum b{font-size:18px}
.err{background:var(--red-l);color:var(--red);padding:11px 14px;border-radius:12px;font-size:13px;font-weight:500;margin-top:14px}
.btn{width:100%;padding:15px;border-radius:15px;border:none;background:var(--grad);box-shadow:0 8px 18px rgba(91,75,219,.3);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:18px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:none;box-shadow:none;color:var(--red);border:1.5px solid var(--line)}
/* chips filter */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.filters::-webkit-scrollbar{display:none}
.fl{border:1.5px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;font:inherit;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.fl.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead b{font-family:Fraunces,serif;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .dow{font-size:11px;color:var(--mute);font-weight:600;padding:4px 0}
.cell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:14px;position:relative;cursor:pointer;border:none;background:none;color:var(--ink);font-family:inherit}
.cell.we{color:var(--mute)}
.cell.today{outline:2px solid var(--brand);outline-offset:-2px;font-weight:700}
.cell.hol{background:var(--brand-l);color:var(--brand-d);font-weight:700}
.cell.sel{background:var(--brand);color:#fff}
.cell i{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:12px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-family:Fraunces,serif}.stat small{font-size:11px;color:var(--mute)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--bg);width:100%;border-radius:26px 26px 0 0;padding:10px 18px 28px;max-height:88%;overflow-y:auto;animation:up .25s}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:9px;margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.tl{position:relative;padding-left:26px;margin-top:6px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;margin-bottom:16px;font-size:14px}
.tl div:before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--line));border:2px solid var(--bg)}
.tl small{display:block;color:var(--mute);font-size:12px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:none}.kv span:first-child{color:var(--mute)}
.toast{position:fixed;top:18px;left:16px;right:16px;background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:20;animation:fade .2s}
.empty{text-align:center;color:var(--mute);padding:40px 10px;font-size:14px}
.prof{text-align:center;padding:10px 0 4px}
.prof .avatar{width:84px;height:84px;font-size:28px;margin:0 auto 10px}
.prof h1{font-size:24px}.prof p{color:var(--mute);font-size:14px}
.menu{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer}
.menu:last-child{border:none}.menu span{flex:1}

/* tablet / desktop */
@media(min-width:700px){
  #view{padding:0 32px 60px}
  .list2{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
  .sheet{max-width:520px;margin:0 auto}
}
@media(min-width:900px){
  .phone{flex-direction:row}
  #view{padding:0 44px 60px}
  header.top{padding-top:32px}
  header.top .t h1{font-size:30px}
  nav{position:static;flex-direction:column;justify-content:flex-start;width:230px;flex:none;border-top:none;border-right:1px solid var(--line);padding:26px 14px;gap:4px;order:-1}
  nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:13px;justify-content:flex-start}
  nav button:hover{background:var(--brand-l)}
  nav button.on{background:var(--brand-l)}
  nav button.apply{order:-1;background:var(--grad);color:#fff;margin-bottom:14px;justify-content:center}
  nav button.apply:hover{filter:brightness(.95)}
  nav button.apply .fab{width:auto;height:auto;margin:0;background:none;box-shadow:none;border:none}
  .brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:20px;padding:0 14px 22px;order:-2}
  .brand i{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
  .sidelink{display:flex;margin-top:auto}
  .cols{display:grid;grid-template-columns:3fr 2fr;gap:28px;align-items:start}
  .hero .big{font-size:48px}
  .scrim{align-items:center}.sheet{border-radius:26px;padding-top:22px}.sheet .grab{display:none}
  .toast{left:auto;right:24px;top:24px;width:360px}
}

/* very small phones */
@media(max-width:379px){
  #view{padding-left:12px;padding-right:12px}
  header.top .t h1{font-size:21px}
  .hero .big{font-size:34px}.hero .row{flex-direction:column}
  .balances{gap:6px}.bal{padding:12px 4px}.ring{width:54px;height:54px}.ring span{width:42px;height:42px;font-size:14px}
  .types{gap:6px}.type{padding:10px 4px}
  .two{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cell{font-size:12px;border-radius:8px}.grid{gap:2px}
  .req{gap:10px;padding:12px}.req .ic{width:38px;height:38px}
  nav button{font-size:10px}
  .card{padding:14px}
}
/* phones in landscape / short screens */
@media(max-height:480px) and (max-width:899px){
  nav{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
  nav button{flex-direction:row;justify-content:center;gap:6px}
  nav button.apply .fab{width:38px;height:38px;margin-top:-14px}
  #view{padding-bottom:70px}.cell{aspect-ratio:auto;height:34px}
  .sheet{max-height:94%}
}
/* large screens */
@media(min-width:1280px){
  nav{width:260px}#view{padding:0 64px 60px}#view>.page{max-width:1180px}
}
@media(min-width:1800px){html{font-size:18px}#view>.page{max-width:1360px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* sign-in gate + notices */
.gate{min-height:100%;display:grid;place-items:center;padding:20px}
.gate .card{width:100%;max-width:400px;padding:24px}
.gate .logo{width:48px;height:48px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-size:22px;margin-bottom:14px}
.warnbox{background:var(--amber-l);color:var(--amber);padding:12px 14px;border-radius:14px;font-size:13px;font-weight:500;margin-bottom:12px}
.btn:disabled{cursor:not-allowed}

/* switch between views */
nav a.vlink{display:none}
@media(min-width:900px){nav a.vlink{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:var(--mute);padding:12px 14px;border-radius:13px;text-decoration:none}nav a.vlink:hover{background:var(--brand-l)}}

nav .sidelink+.sidelink{margin-top:0}

/* attendance calendar: WFH = light blue, present = light green, applied leave = light purple, everything else = light yellow */
:root{--c-wfh:#dbeafe;--c-wfh-t:#1e40af;--c-pres:#dcfce7;--c-pres-t:#166534;--c-leave:#ede9fe;--c-leave-t:#5b21b6;--c-other:#fef9c3;--c-other-t:#854d0e}
@media (prefers-color-scheme:dark){:root{--c-wfh:#1e3a5f;--c-wfh-t:#93c5fd;--c-pres:#14532d;--c-pres-t:#86efac;--c-leave:#3b2a6b;--c-leave-t:#c4b5fd;--c-other:#4a3f12;--c-other-t:#fde68a}}
.cell.k-wfh{background:var(--c-wfh);color:var(--c-wfh-t);--sb:var(--c-wfh);--sf:var(--c-wfh-t)}
.cell.k-present{background:var(--c-pres);color:var(--c-pres-t);--sb:var(--c-pres);--sf:var(--c-pres-t)}
.cell.k-leave{background:var(--c-leave);color:var(--c-leave-t);--sb:var(--c-leave);--sf:var(--c-leave-t)}
.cell.k-other{background:var(--c-other);color:var(--c-other-t);--sb:var(--c-other);--sf:var(--c-other-t)}
.cell[class*=" k-"]{font-weight:600}
.cell.k-pend{border:2px dashed currentColor}
.cell.sel[class*=" k-"]{background:var(--sb);color:var(--sf);box-shadow:inset 0 0 0 2.5px var(--brand)}
.kpill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700}
.kpill.k-wfh{background:var(--c-wfh);color:var(--c-wfh-t)}.kpill.k-present{background:var(--c-pres);color:var(--c-pres-t)}
.kpill.k-leave{background:var(--c-leave);color:var(--c-leave-t)}.kpill.k-other{background:var(--c-other);color:var(--c-other-t)}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:12px}
.lg span:before{content:"";display:inline-block;width:13px;height:13px;border-radius:4px;background:var(--c);border:1px solid rgba(0,0,0,.12);margin-right:6px;vertical-align:-2px}
.statc{border-radius:14px;padding:10px 4px;text-align:center}
.statc b{display:block;font-size:20px;font-family:Fraunces,serif}.statc small{font-size:11px}
.statc.k-wfh{background:var(--c-wfh);color:var(--c-wfh-t)}.statc.k-present{background:var(--c-pres);color:var(--c-pres-t)}
.statc.k-leave{background:var(--c-leave);color:var(--c-leave-t)}.statc.k-other{background:var(--c-other);color:var(--c-other-t)}
.dreq{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
</style>
</head>
<body>
<div class="phone">
  <div id="view"></div>
  <nav id="nav"></nav>
  <div id="overlay"></div>
</div>

<script>
/* =============== API client (talks to the Cloudflare Worker + D1) =============== */
let ACCOUNTING=false;   // leave balances are not shown or enforced unless the server turns this on
let LEAVE_TYPES={};   // { code: {label, active, quotas:{employee,manager}} } – set from the server
const quotaFor=(who,type)=>{const r=typeof who==='string'?who:(hasRole(who,'manager')?'manager':'employee');return Number(((LEAVE_TYPES[type]||{}).quotas||{})[r==='employee'?'employee':'manager'])||0};
const blankDB=()=>({teams:[],emps:[],teamLeads:{},holidays:[],reqs:[],att:{},imports:[],audit:[],resets:[]});
let DB=blankDB(), ME=null, NEEDS_SETUP=false, EMAIL_ENABLED=false, BOOTING=true;
let gateMode=new URLSearchParams(location.search).get('reset')?'reset':'login';
let gateMsg='';
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function api(method,url,body){
  let r;
  try{r=await fetch(url,{method,credentials:'same-origin',headers:{'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){const err=new Error('Can’t reach the server. Check your connection and try again.');err.status=0;throw err}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){
    const err=new Error(j.error||'Request failed ('+r.status+')');err.status=r.status;
    if(r.status===401&&!url.startsWith('/api/auth/')){ME=null;DB=blankDB();setTimeout(()=>{if(typeof PAGE!=='undefined'&&PAGE!=='login'&&PAGE!=='forgot')goLogin()},0)}
    throw err;
  }
  return j;
}
async function loadState(){
  try{
    const s=await api('GET','/api/state');
    ME=s.me;
    ACCOUNTING=!!s.accounting;
    // the server stores UTC; show people their own local time
    const pad=n=>String(n).padStart(2,'0');
    const local=t=>{if(typeof t!=='string'||t.length<16)return t;const d=new Date(t.slice(0,10)+'T'+t.slice(11,16)+':00Z');
      return isNaN(d)?t:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
    (s.reqs||[]).forEach(r=>{r.created=local(r.created);(r.hist||[]).forEach(h=>{h[1]=local(h[1])})});
    (s.audit||[]).forEach(a=>{a.t=local(a.t)});
    (s.imports||[]).forEach(i=>{i.at=local(i.at)});
    LEAVE_TYPES=Object.fromEntries((s.leaveTypes||[]).map(t=>[t.code,{label:t.name,active:t.active,quotas:t.quotas}]));
    DB={teams:s.teams||[],emps:s.emps||[],teamLeads:s.teamLeads||{},holidays:s.holidays||[],reqs:s.reqs||[],att:s.att||{},imports:s.imports||[],audit:s.audit||[],resets:s.resets||[]};
    return true;
  }catch(e){
    if(e.status===401){ME=null;DB=blankDB();try{const st=await api('GET','/api/auth/status');NEEDS_SETUP=st.needsSetup;EMAIL_ENABLED=!!st.emailEnabled}catch(_){}return false}
    throw e;
  }
}

function pendingDays(empId,type){return DB.reqs.filter(r=>r.emp===empId&&r.kind==='leave'&&r.type===type&&r.status==='Pending').reduce((a,r)=>a+r.days,0)}

const HOME={admin:'/admin',manager:'/manager',employee:'/employee'};

const homeFor=p=>HOME[hasRole(p,'admin')?'admin':hasRole(p,'manager')?'manager':'employee'];

function appKey(path){return path.split('#')[0].split('?')[0].replace(/\.html$/,'').replace(/^\/+/,'')}
function goLogin(){location.replace('/?next='+encodeURIComponent(location.pathname+location.hash))}
function nextTarget(){
  const n=new URLSearchParams(location.search).get('next')||'';
  if(!n.startsWith('/')||n.startsWith('//'))return null;
  const k=appKey(n);
  if(!ACCESS[k]||!ME||!canOpen(ME,k))return null;
  return '/'+k+(n.includes('#')?n.slice(n.indexOf('#')):'');
}
function viewLinks(){
  if(!ME)return [];

async function boot(){
  try{await loadState()}catch(e){}
  BOOTING=false;
  if(PAGE==='forgot'){render();return}
  if(PAGE==='login'){
    if(ME&&gateMode!=='reset'){onAuthed();return}
    render();return;
  }
  if(!ME){goLogin();return}
  if(ME.mustChange){location.replace('/');return}
  if(!canOpen(ME,PAGE)){location.replace(homeFor(ME));return}
  render();
}

  const days=frm.from&&frm.to&&frm.to>=frm.from?workdays(frm.from,frm.to,frm.half):0;
  const sh=shownTypes();
  if(isL&&sh.length&&!sh.some(([k])=>k===frm.type))frm.type=sh[0][0];
  return `<header class="top"><div class="t"><small>New request</small><h1>Apply</h1></div></header>
  <div class="seg"><button class="${isL?'on':''}" onclick="frm.kind='leave';frm.err='';render()">Leave</button><button class="${!isL?'on':''}" onclick="frm.kind='wfh';frm.err='';frm.to=frm.from;render()">Work from home</button></div>
  ${isL?`<label class="f" style="margin-top:0">Leave type</label>
    <div class="types">${sh.length?sh.map(([k,v])=>`<button class="type ${frm.type===k?'on':''}" onclick="frm.type='${k}';render()"><b>${esc(v.label)}</b></button>`).join(''):'<div class="warnbox" style="grid-column:1/-1">No leave types are set up for you yet. Please ask HR.</div>'}</div>`:''}
  <div class="${isL?'two':''}">
    <div><label class="f">${isL?'From':'Date'}</label><input class="in" type="date" id="from" value="${frm.from}" min="${TODAY}" onchange="frm.from=this.value;if(frm.to<frm.from||!${isL})frm.to=frm.from;render()"></div>
    ${isL?`<div><label class="f">To</label><input class="in" type="date" id="to" value="${frm.to}" min="${frm.from}" onchange="frm.to=this.value;render()"></div>`:''}
  </div>
  ${isL?`<div class="toggle"><div><b style="font-size:14px">Half day</b><br><small style="color:var(--mute)">Counts as 0.5 day per working day</small></div><button class="sw ${frm.half?'on':''}" onclick="frm.half=!frm.half;render()"></button></div>`:''}
  ${isL?`<div class="sum">Working days: <b>${days}</b><br><small style="color:var(--mute)">Weekends and company holidays are not counted.</small></div>`:''}
  <label class="f">Reason</label>
  <textarea class="in" id="reason" placeholder="${isL?'Briefly describe the reason':'Why do you need to work from home?'}" oninput="frm.reason=this.value">${esc(frm.reason)}</textarea>
  ${mg?`<div class="mgr"><div class="avatar">${ini(mg.name)}</div><div>Goes to <b>${esc(mg.name)}</b><br><span style="color:var(--mute)">${esc(mg.desig||'Manager')} · your reporting manager</span></div></div>`
      :`<div class="err">No reporting manager is assigned to you. Ask HR to set one before applying.</div>`}
  ${frm.err?`<div class="err">${esc(frm.err)}</div>`:''}
  <button class="btn" ${mg?'':'disabled style="opacity:.5"'} onclick="submitReq()">Submit ${isL?'leave':'WFH'} request</button>
  <p style="text-align:center;color:var(--mute);font-size:12px;margin-top:10px">Your manager will be notified.</p>`;
}
async function submitReq(){
  const r=frm, isL=r.kind==='leave', mg=manager();
  if(!mg) return fail('No reporting manager is assigned to you.');
  if(!r.from||(isL&&!r.to)) return fail('Please select the date(s).');
  const to=isL?r.to:r.from;
  if(to<r.from) return fail('End date cannot be before start date.');
  if(!r.reason.trim()) return fail('Please add a reason.');
  try{
    const res=await api('POST','/api/requests',{kind:r.kind,type:isL?r.type:null,from:r.from,to,half:isL&&r.half,reason:r.reason.trim()});
    await loadState();
    frm={kind:r.kind,type:'annual',from:TODAY,to:TODAY,half:false,reason:'',err:''};
    filter='All'; go('requests');
    const msg=`Hi ${mg.name.split(' ')[0]}, I’ve requested ${waKind({kind:r.kind,type:r.type})} for ${waRange({from:r.from,to})} (${res.days} day${res.days===1?'':'s'}).\nReason: ${r.reason.trim()}\nPlease review and approve or reject: ${reviewLink(res.no)}\n– ${ME.name}`;
    showWhatsApp(`Request ${res.no} sent`,mg.name,mg.phone,msg);
  }catch(err){fail(err.message)}
}
function fail(m){frm.err=m;render();$('#view').scrollTo({top:9999,behavior:'smooth'})}

function vRequests(){
  const rs=myReqs(), fs=['All','Pending','Approved','Rejected'];
  const list=rs.filter(r=>filter==='All'||r.status===filter);
  return `<header class="top"><div class="t"><small>${rs.length} total</small><h1>My requests</h1></div></header>
  <div class="filters">${fs.map(f=>`<button class="fl ${filter===f?'on':''}" onclick="filter='${f}';render()">${f}${f!=='All'?` · ${rs.filter(r=>r.status===f).length}`:''}</button>`).join('')}</div>
  ${list.length?'<div class="list2">'+list.map(reqRow).join('')+'</div>':'<div class="empty">No requests here yet.</div>'}`;
}
function openReq(no){
  const r=DB.reqs.find(x=>x.no===no&&x.emp===meId); if(!r)return;
  const lt=r.kind==='leave'?LT[r.type]:null, ap=DB.emps.find(e=>e.id===r.appr);
  const colors={Submitted:'var(--amber)',Approved:'var(--green)',Rejected:'var(--red)',Cancelled:'var(--mute)'};
  sheet(`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:22px">${lt?lt.label+' leave':'Work from home'}</h2><span class="pill ${r.status}">${r.status}</span></div>
   <small style="color:var(--mute)">${esc(r.no)}</small>
   <div class="card" style="margin-top:14px;padding:6px 16px">
     <div class="kv"><span>Dates</span><b>${range(r)}</b></div>
     <div class="kv"><span>Duration</span><b>${r.days} day${r.days===1?'':'s'}${r.half?' (half day)':''}</b></div>
     <div class="kv"><span>Approver</span><b>${esc(ap?ap.name:'—')}</b></div>
     <div class="kv"><span>Reason</span><b style="max-width:60%;text-align:right">${esc(r.reason)}</b></div></div>
   ${r.rej?`<div class="err" style="margin-top:0"><b>Reason for rejection</b><br>${esc(r.rej)}</div>`:''}
   <div class="sec" style="margin:18px 2px 6px"><h2 style="font-size:16px">History</h2></div>
   <div class="tl">${r.hist.map(([a,t])=>`<div style="--c:${colors[a.split(' ')[0]]||'var(--mute)'}">${esc(a)}<small>${esc(t)}</small></div>`).join('')}
     ${r.status==='Pending'?`<div style="--c:var(--line)"><span style="color:var(--mute)">Waiting for ${esc(ap?ap.name:'your manager')}…</span></div>`:''}</div>
   ${r.status==='Pending'?`<button class="btn" style="background:#25D366;box-shadow:none" onclick="nudgeManager('${r.no}')">Message manager on WhatsApp</button><button class="btn ghost" onclick="cancelReq('${r.no}')">Cancel request</button>`:''}
   ${r.status==='Rejected'?`<button class="btn" onclick="closeSheet();frm.kind='${r.kind}';go('apply')">Apply again</button>`:''}`);
}
function nudgeManager(no){
  const r=DB.reqs.find(x=>x.no===no),mg=manager();if(!r||!mg)return;
  const msg=`Hi ${mg.name.split(' ')[0]}, a reminder about my ${waKind(r)} request for ${waRange(r)} (${r.days} day${r.days===1?'':'s'}).\nPlease review: ${reviewLink(r.no)}\n– ${ME.name}`;
  showWhatsApp('Message your manager',mg.name,mg.phone,msg);
}
async function cancelReq(no){
  try{await api('POST',`/api/requests/${encodeURIComponent(no)}/cancel`,{});await loadState();closeSheet();render();toast('Request cancelled')}
  catch(err){toast(err.message);try{await loadState()}catch(_){}closeSheet();render()}
}

function monthGrid(m,cellFn){
  const first=new Date(m.getFullYear(),m.getMonth(),1), n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const off=(first.getDay()+6)%7; let h=['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  h+='<div></div>'.repeat(off);
  for(let i=1;i<=n;i++) h+=cellFn(iso(new Date(m.getFullYear(),m.getMonth(),i)),i);
  return `<div class="grid">${h}</div>`;
}
const mTitle=m=>m.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
function vCalendar(){
  const hm=holMap(), rs=myReqs();
  const grid=monthGrid(calMonth,(ds,i)=>{
    const dow=P(ds).getDay(), we=dow===0||dow===6, h=hm[ds];
    const mine=rs.filter(r=>['Approved','Pending'].includes(r.status)&&ds>=r.from&&ds<=r.to&&!we);
    const dot=mine[0]?`<i style="background:${mine[0].kind==='wfh'?'var(--plum)':mine[0].status==='Pending'?'var(--amber)':'var(--green)'}"></i>`:'';
    return `<button class="cell ${we?'we':''} ${h?'hol':''} ${ds===TODAY?'today':''} ${selDay===ds?'sel':''}" onclick="selDay='${ds}';render()">${i}${dot}</button>`});
  const inMonth=sortedHol().filter(h=>h.d.startsWith(iso(calMonth).slice(0,7)));
  let detail='';
  if(selDay){const mine=rs.filter(r=>['Approved','Pending'].includes(r.status)&&selDay>=r.from&&selDay<=r.to);
    detail=`<div class="card"><b>${fmt(selDay,{weekday:'long',day:'numeric',month:'long'})}</b><br><small style="color:var(--mute)">${esc(hm[selDay]||(mine.length?'':'No holiday or request'))}</small>${mine.map(r=>`<div style="margin-top:8px;cursor:pointer" onclick="openReq('${r.no}')"><span class="pill ${r.status}">${r.status}</span> ${r.kind==='wfh'?'Work from home':LT[r.type].label+' leave'}</div>`).join('')}</div>`}
  return `<header class="top"><div class="t"><small>Company calendar</small><h1>Holidays</h1></div></header>
  <div class="cols"><div><div class="card"><div class="calhead"><button class="iconbtn" onclick="calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);selDay=null;render()">${ic('left')}</button><b>${mTitle(calMonth)}</b><button class="iconbtn" onclick="calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);selDay=null;render()">${ic('right')}</button></div>
  ${grid}<div class="legend"><span style="--c:var(--brand)">Holiday</span><span style="--c:var(--green)">Leave</span><span style="--c:var(--amber)">Pending</span><span style="--c:var(--plum)">WFH</span></div></div>
  ${detail}</div><div>
  <div class="sec" style="margin-top:0"><h2>${calMonth.toLocaleDateString('en-GB',{month:'long'})} holidays</h2></div>
  ${inMonth.length?inMonth.map(holRow).join(''):'<div class="empty" style="padding:16px">No holidays this month.</div>'}
  <div class="sec"><h2>All holidays</h2></div>${sortedHol().map(holRow).join('')||'<div class="empty">None added yet.</div>'}</div></div>`;
}

/* attendance comes only from HR’s CSV imports; leave/WFH approvals stay separate */
// the biometric device doesn't know our holidays, so "absent" on a company holiday is shown as a holiday
const effective=(ds,a)=>(a&&a.s==='absent'&&holMap()[ds])?{s:'holiday'}:a;
function attFor(ds){
  const rec=DB.att[meId+'|'+ds]; if(rec)return effective(ds,rec);
  if(holMap()[ds]&&![0,6].includes(P(ds).getDay()))return {s:'holiday'};
  return null;
}
const ANAMES={present:'Present',late:'Late arrival',wfh:'Work from home',absent:'Absent',leave:'On leave',half_day:'Half day',weekoff:'Weekly off',holiday:'Holiday'};
const ACOL={present:'var(--green)',late:'var(--amber)',wfh:'var(--plum)',absent:'var(--red)',leave:'var(--blue)',half_day:'var(--blue)',weekoff:'var(--mute)',holiday:'var(--brand)'};
const KLABEL={wfh:'Work from home',present:'Present',leave:'Leave',other:'Other'};
const KSWATCH={wfh:'var(--c-wfh)',present:'var(--c-pres)',leave:'var(--c-leave)',other:'var(--c-other)'};
/* what happened on a date, from the employee's requests and the HR-uploaded attendance (requests win over punches) */
function dayInfo(ds){
  const dow=P(ds).getDay(), we=dow===0||dow===6, hol=holMap()[ds]||'';
  const working=!we&&!hol;
  const reqs=myReqs().filter(r=>ds>=r.from&&ds<=r.to);
  const live=reqs.filter(r=>['Approved','Pending'].includes(r.status));
  const rec=DB.att[meId+'|'+ds]||null;
  const leave=working&&live.find(r=>r.kind==='leave'), wfh=working&&live.find(r=>r.kind==='wfh');
  let kind=null,pend=false;
  if(leave){kind='leave';pend=leave.status==='Pending'}
  else if(wfh){kind='wfh';pend=wfh.status==='Pending'}
  else if(rec&&(rec.s==='present'||rec.s==='late'))kind='present';
  else if(rec&&rec.s==='wfh')kind='wfh';
  else if(rec&&rec.s==='leave')kind='leave';
  else if(rec||hol)kind='other';
  return {ds,kind,pend,reqs,rec,hol,we,working};
}
function officeTime(a,b){
  if(!a||!b)return '';const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);const t=(h2*60+m2)-(h1*60+m1);
  return t>0?`${Math.floor(t/60)}h ${String(t%60).padStart(2,'0')}m`:'';
}
function dayDetail(ds){
  const d=dayInfo(ds), title=fmt(ds,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const out=[];
  d.reqs.forEach(r=>{
    const label=r.kind==='wfh'?'Work from home':((LT[r.type]?LT[r.type].label:'Leave')+' leave');
    const ap=DB.emps.find(x=>x.id===r.appr);
    out.push(`<div class="dreq"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(label)}</b><span class="pill ${r.status}">${r.status}</span></div>
      <div class="kv"><span>Dates</span><b>${range(r)}</b></div>
      <div class="kv"><span>Duration</span><b>${r.days} day${r.days===1?'':'s'}${r.half?' (half day)':''}</b></div>
      <div class="kv"><span>Reason</span><b style="max-width:62%;text-align:right">${esc(r.reason)}</b></div>
      <div class="kv"><span>${r.status==='Pending'?'Waiting for':'Decided by'}</span><b>${esc(ap?ap.name:'—')}</b></div>
      ${r.rej?`<div class="err" style="margin-top:8px"><b>Reason for rejection</b><br>${esc(r.rej)}</div>`:''}
      <a style="color:var(--brand);font-weight:600;font-size:13px;cursor:pointer" onclick="openReq('${r.no}')">View request →</a></div>`);
  });
  if(d.hol)out.push(`<div class="dreq"><div class="kv" style="border:none"><span>Holiday</span><b>${esc(d.hol)}</b></div></div>`);
  if(d.rec){
    const a=effective(ds,d.rec), t=officeTime(a.in,a.out);
    out.push(`<div class="dreq"><b>Attendance (uploaded by HR)</b>
      <div class="kv"><span>Status</span><b>${ANAMES[a.s]||a.s}</b></div>
      ${a.in?`<div class="kv"><span>Check-in</span><b>${esc(a.in)}</b></div><div class="kv"><span>Check-out</span><b>${esc(a.out||'—')}</b></div>${t?`<div class="kv"><span>Time in office</span><b>${t}</b></div>`:''}`:''}</div>`);
  }else if(d.working&&ds<=TODAY){
    out.push(`<div class="dreq"><small style="color:var(--mute)">No attendance has been uploaded for this day.</small></div>`);
  }else if(ds>TODAY){
    out.push(`<div class="dreq"><small style="color:var(--mute)">Upcoming day.</small></div>`);
  }
  if(!out.length)out.push(`<div class="dreq"><small style="color:var(--mute)">Nothing recorded for this day.</small></div>`);
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b>${title}</b>${d.kind?`<span class="kpill k-${d.kind}">${KLABEL[d.kind]}${d.pend?' · pending':''}</span>`:''}</div>${out.join('')}</div>`;
}
function vAttendance(){
  const cnt={wfh:0,present:0,leave:0,other:0};
  const grid=monthGrid(attMonth,(ds,i)=>{
    const d=dayInfo(ds);
    if(d.kind)cnt[d.kind]++;
    const aria=`${fmt(ds,{day:'numeric',month:'long'})}${d.kind?': '+KLABEL[d.kind]+(d.pend?' (pending)':''):''}`;
    return `<button class="cell ${d.kind?'k-'+d.kind:''} ${d.pend?'k-pend':''} ${d.we?'we':''} ${ds===TODAY?'today':''} ${selDay===ds?'sel':''}" aria-label="${aria}" onclick="selDay='${ds}';render()">${i}</button>`});
  const rows=Object.keys(DB.att).filter(k=>k.startsWith(meId+'|')).map(k=>[k.split('|')[1],effective(k.split('|')[1],DB.att[k])]).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,10);
  return `<header class="top"><div class="t"><small>Attendance, work from home and leave</small><h1>My attendance</h1></div></header>
  <div class="stats"><div class="statc k-wfh"><b>${cnt.wfh}</b><small>Work from home</small></div><div class="statc k-present"><b>${cnt.present}</b><small>Present</small></div><div class="statc k-leave"><b>${cnt.leave}</b><small>Leave</small></div><div class="statc k-other"><b>${cnt.other}</b><small>Other</small></div></div>
  <div class="cols"><div><div class="card"><div class="calhead"><button class="iconbtn" onclick="attMonth=new Date(attMonth.getFullYear(),attMonth.getMonth()-1,1);selDay=null;render()">${ic('left')}</button><b>${mTitle(attMonth)}</b><button class="iconbtn" onclick="attMonth=new Date(attMonth.getFullYear(),attMonth.getMonth()+1,1);selDay=null;render()">${ic('right')}</button></div>
  ${grid}<div class="lg"><span style="--c:var(--c-wfh)">Work from home</span><span style="--c:var(--c-pres)">Present</span><span style="--c:var(--c-leave)">Leave applied</span><span style="--c:var(--c-other)">Other</span></div>
  <small style="color:var(--mute);display:block;margin-top:8px">Tap a date for details. A dashed outline means the request is still waiting for approval.</small></div>
  ${selDay?dayDetail(selDay):''}</div><div>
  <div class="sec" style="margin-top:0"><h2>Recent attendance</h2></div>
  ${rows.length?rows.map(([ds,a])=>`<div class="card hol" style="cursor:pointer" onclick="attMonth=new Date(${P(ds).getFullYear()},${P(ds).getMonth()},1);selDay='${ds}';render()"><div class="d"><b>${P(ds).getDate()}</b><small>${P(ds).toLocaleDateString('en-GB',{month:'short'})}</small></div><div class="m" style="flex:1"><b>${ANAMES[a.s]||a.s}</b><small>${a.in?esc(a.in)+' → '+esc(a.out||'—'):'No check-in recorded'}</small></div></div>`).join(''):'<div class="card" style="text-align:center;color:var(--mute)">No attendance uploaded for you yet.</div>'}
  <p style="color:var(--mute);font-size:12px;text-align:center;margin-top:8px">Present days come from the attendance file uploaded by HR. Work from home and leave come from your requests. Spot a mistake? Contact HR.</p></div></div>`;
}

function vProfile(){
  const e=me(), mg=manager();
  return `<header class="top"><button class="iconbtn" onclick="go('home')">${ic('left')}</button><div class="t"></div></header>
  <div class="prof"><div class="avatar">${ini(e.name)}</div><h1>${esc(e.name)}</h1><p>${esc(e.desig||'')}${e.desig?' · ':''}${esc(e.team||'')}</p></div>
  <div class="card" style="margin-top:18px;padding:6px 16px">
    <div class="kv"><span>Employee ID</span><b>${esc(e.id)}</b></div><div class="kv"><span>Email</span><b>${esc(e.email)}</b></div>
    <div class="kv"><span>Team</span><b>${esc(e.team||'—')}</b></div><div class="kv"><span>Reports to</span><b>${mg?esc(mg.name):'Not assigned'}</b></div></div>
  <div class="card" style="padding:0">
    ${viewLinks().map(([k,l,h])=>`<a class="menu" href="${h}" style="text-decoration:none;color:inherit">${ic('user')}<span>Switch to ${l}</span>${ic('right')}</a>`).join('')}
    <div class="menu" onclick="openPhone()">${ic('help')}<span>WhatsApp number${ME.phone?' · '+esc(ME.phone):''}</span>${ic('right')}</div>
    <div class="menu" onclick="openChangePassword()">${ic('lock')}<span>Change password</span>${ic('right')}</div>
    <div class="menu" onclick="toast('Contact HR to change your details')">${ic('help')}<span>Help & HR contact</span>${ic('right')}</div>
    <div class="menu" style="color:var(--red)" onclick="doLogout()">${ic('out')}<span>Sign out</span></div></div>`;
}

const VIEWS={home:vHome,apply:vApply,requests:vRequests,calendar:vCalendar,attendance:vAttendance,profile:vProfile};
function render(){
  meId=ME?ME.id:null;
  rebuildLT();
  const st=$('#view').scrollTop;
  if(!ME){$('#nav').style.display='none';$('#view').innerHTML=vGate();return}
  $('#nav').style.display='';
  $('#view').innerHTML='<div class="page'+(tab==='apply'||tab==='profile'?' narrow':'')+'">'+VIEWS[tab]()+'</div>';
  $('#view').scrollTop=st;
  const items=[['home','Home','home'],['requests','Requests','list'],['apply','Apply','plus'],['calendar','Holidays','cal'],['attendance','Attendance','clock']];
  $('#nav').innerHTML='<div class="brand"><i>L</i>LeaveDesk</div>'+items.map(([k,l,i])=>k==='apply'
    ?`<button class="apply" onclick="go('apply')"><span class="fab">${ic(i)}</span>${l}</button>`
    :`<button class="${tab===k?'on':''}" onclick="go('${k}')">${ic(i)}${l}</button>`).join('')+viewNav()+`<button class="sidelink ${tab==='profile'?'on':''}" onclick="go('profile')">${ic('user')}Profile</button>`;
}
boot();

</script>
